# =====================================================
# HabilitFy - LOCAL DEVELOPMENT ONLY
# -----------------------------------------------------
# WARNING: This compose file uses weak, well-known passwords and
# exposes services on every network interface. It is intended ONLY
# for local development on a trusted workstation. NEVER deploy to a
# server, VPS, or any host reachable from the internet.
# For production, use docker-compose.yml (which requires secrets via env).
# =====================================================

services:
  db:
    image: mysql:8.4
    container_name: habilitfy-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: habilitfy
      MYSQL_USER: habilitfy
      MYSQL_PASSWORD: habilitfy_dev
      MYSQL_ROOT_PASSWORD: root_dev_password
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./migrations/mysql-schema.sql:/docker-entrypoint-initdb.d/001-mysql-schema.sql:ro
    # Loopback-only bind so the dev DB is never reachable from LAN.
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - habilitfy-dev

  redis:
    image: redis:7-alpine
    container_name: habilitfy-redis-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - habilitfy-dev

  adminer:
    image: adminer:latest
    container_name: habilitfy-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:8080"
    networks:
      - habilitfy-dev
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog:latest
    container_name: habilitfy-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - habilitfy-dev

volumes:
  mysql_dev_data:
    driver: local

networks:
  habilitfy-dev:
    driver: bridge
