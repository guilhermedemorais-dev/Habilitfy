# HabilitFy - Development Docker Compose
# Usage: docker-compose -f docker-compose.dev.yml up

version: '3.8'

services:
  # =====================
  # PostgreSQL Database
  # =====================
  db:
    image: postgres:16-alpine
    container_name: habilitfy-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: habilitfy
      POSTGRES_PASSWORD: habilitfy_dev
      POSTGRES_DB: habilitfy
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - habilitfy-dev

  # =====================
  # Redis Cache
  # =====================
  redis:
    image: redis:7-alpine
    container_name: habilitfy-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - habilitfy-dev

  # =====================
  # pgAdmin (Database UI)
  # =====================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: habilitfy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@habilitfy.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - habilitfy-dev
    depends_on:
      - db

  # =====================
  # MailHog (Email Testing)
  # =====================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: habilitfy-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - habilitfy-dev

volumes:
  postgres_dev_data:
    driver: local

networks:
  habilitfy-dev:
    driver: bridge
