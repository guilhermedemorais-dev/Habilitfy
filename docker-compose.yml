# =====================================================
# HabilitFy - Production docker-compose
# -----------------------------------------------------
# Managed deploy panels do not always pass compose-level environment
# variables during interpolation, so production-safe values should be
# provided by the panel but deployable defaults are kept here.
# Override in production:
#   DB_NAME, DB_USER, DB_PASSWORD, DB_ROOT_PASSWORD,
#   SESSION_SECRET, BASE_URL, DOMAIN
# Recommended:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, OWNER_MASTER_EMAIL,
#   ABACATEPAY_API_KEY, ABACATEPAY_WEBHOOK_SECRET, STRIPE_API_KEY,
#   SMTP_*, OPENAI_API_KEY, ANTHROPIC_API_KEY
#
# Provide them via your orchestrator's secret manager or a server-only
# .env file (chmod 600). NEVER commit real values.
# =====================================================

services:
  db:
    image: mysql:8.4
    container_name: habilitfy-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-habilitfy}
      MYSQL_USER: ${DB_USER:-habilitfy}
      MYSQL_PASSWORD: ${DB_PASSWORD:-habilitfy_app_local_only_change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-habilitfy_root_local_only_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/mysql-schema.sql:/docker-entrypoint-initdb.d/001-mysql-schema.sql:ro
    healthcheck:
      # Use root socket auth via env to avoid leaking the app password to argv.
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - habilitfy-network
    # No `ports:` mapping in production: MySQL is reachable only via the
    # internal `habilitfy-network`. To expose for emergency admin access,
    # bind to loopback only and tunnel via SSH:
    #   ports:
    #     - "127.0.0.1:3306:3306"

  redis:
    image: redis:7-alpine
    container_name: habilitfy-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - habilitfy-network
    # No `ports:` in production — internal network only.
    # Loopback-only override if absolutely needed:
    #   ports:
    #     - "127.0.0.1:6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habilitfy-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      BASE_URL: ${BASE_URL:-https://habilitfy.com.br}
      DOMAIN: ${DOMAIN:-habilitfy.com.br}
      DATABASE_URL: mysql://${DB_USER:-habilitfy}:${DB_PASSWORD:-habilitfy_app_local_only_change_me}@db:3306/${DB_NAME:-habilitfy}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-habilitfy}
      DB_PASSWORD: ${DB_PASSWORD:-habilitfy_app_local_only_change_me}
      DB_NAME: ${DB_NAME:-habilitfy}
      SESSION_SECRET: "${SESSION_SECRET:-replace_this_session_secret_in_production_64_chars_minimum}"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      GOOGLE_AUTO_REGISTER: ${GOOGLE_AUTO_REGISTER:-false}
      OWNER_MASTER_EMAIL: ${OWNER_MASTER_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ABACATEPAY_API_KEY: ${ABACATEPAY_API_KEY:-}
      ABACATEPAY_WEBHOOK_SECRET: ${ABACATEPAY_WEBHOOK_SECRET:-}
      ABACATEPAY_BASE_URL: ${ABACATEPAY_BASE_URL:-https://api.abacatepay.com}
      ABACATEPAY_DEV_MODE: ${ABACATEPAY_DEV_MODE:-false}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
    # Expose app on loopback by default; put a TLS-terminating reverse proxy
    # (Caddy/Traefik/Nginx) in front. To bind publicly, override in a
    # docker-compose.override.yml that you do not commit.
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - habilitfy-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  habilitfy-network:
    driver: bridge
